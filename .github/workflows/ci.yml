name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  schedule:
    # Twice daily (00:00 and 12:00 UTC). https://crontab.guru
    - cron: "0 0,12 * * *"
  workflow_dispatch:

# One refresh at a time on master; don't cancel an in-flight publish.
concurrency:
  group: profile-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      USER_TOKEN: ${{ secrets.USER_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # GITHUB_TOKEN pushes do not re-trigger workflows (avoids refresh loops).
          # fetch-depth 0 so rebase onto origin/master works cleanly.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Regenerate profile artifacts
        run: uv run python ./.github/workflows/ci.py

      - name: Test
        run: uv run pytest -q

      # Publish only outside PRs. PRs are detached HEAD (merge commit).
      # Append a normal commit and rebase instead of force-pushing master.
      - name: Commit and push regenerated files
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .
          if git diff --staged --quiet; then
            echo "No artifact changes to publish"
            exit 0
          fi
          git commit -m "ci: refresh profile artifacts"
          # If another job landed first, rebase and retry push once.
          i=0
          until git pull --rebase origin master && git push origin HEAD:master; do
            i=$((i + 1))
            if [ "$i" -ge 3 ]; then
              echo "Push failed after rebase retries; not force-pushing"
              exit 1
            fi
            echo "Retrying rebase+push ($i)"
            sleep 2
          done
